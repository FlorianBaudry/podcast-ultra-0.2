
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Ultra - Podcasts & Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .aspect-square { aspect-ratio: 1 / 1; }
        .aspect-\[2\/3\] { aspect-ratio: 2 / 3; }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
        
        /* Continuous Marquee Animation */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
        }
        .marquee-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
        }
        
        /* Light Mode Surcharges Pures */
        .theme-light body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .theme-light .bg-slate-950,
        .theme-light .bg-slate-900, 
        .theme-light .bg-black,
        .theme-light .bg-slate-800,
        .theme-light .bg-slate-900\/30,
        .theme-light .bg-slate-900\/40,
        .theme-light .bg-slate-800\/50,
        .theme-light .bg-slate-800\/60 {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
            color: #09090b !important;
        }
        /* Section cards: bg-slate-900/50 and bg-slate-900/60 → white cards with subtle border */
        .theme-light .bg-slate-900\/50,
        .theme-light .bg-slate-900\/60 {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
            color: #09090b !important;
        }
        /* Episode cards: bg-slate-900/40 and bg-slate-800/80 */
        .theme-light .bg-slate-900\/40,
        .theme-light .bg-slate-800\/80 {
            background-color: #f8fafc !important;
            border-color: #e2e8f0 !important;
            color: #09090b !important;
        }
        .theme-light .bg-slate-900\/80,
        .theme-light .bg-black\/50,
        .theme-light .bg-black\/20,
        .theme-light .bg-slate-900\/10,
        .theme-light .backdrop-blur-xl,
        .theme-light .backdrop-blur-md,
        .theme-light .backdrop-blur-sm {
            background-color: rgba(255, 255, 255, 0.98) !important;
            backdrop-filter: blur(20px) !important;
        }
        .theme-light .text-white {
            color: #0f172a !important;
        }
        .theme-light .text-slate-400, 
        .theme-light .text-slate-300,
        .theme-light .text-slate-200 {
            color: #475569 !important;
        }
        .theme-light .text-slate-500,
        .theme-light .text-slate-600 {
            color: #64748b !important;
        }
        .theme-light .border-white\/5, 
        .theme-light .border-white\/10,
        .theme-light .border-white\/20,
        .theme-light .border-slate-800 {
            border-color: rgba(0, 0, 0, 0.1) !important;
        }
        .theme-light .bg-white\/5, 
        .theme-light .bg-white\/10,
        .theme-light .bg-slate-800\/50 {
            background-color: rgba(0, 0, 0, 0.05) !important;
        }
        .theme-light .hover\:bg-white\/10:hover, 
        .theme-light .hover\:bg-white\/5:hover,
        .theme-light .hover\:bg-slate-800:hover {
            background-color: rgba(0, 0, 0, 0.08) !important;
        }
        .theme-light input, .theme-light select {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border: 1px solid #cbd5e1 !important;
        }
        .theme-light .shadow-xl {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;
        }
        .theme-light ::-webkit-scrollbar-track {
            background: #f1f5f9 !important;
        }
        .theme-light ::-webkit-scrollbar-thumb {
            background: #cbd5e1 !important;
        }
        /* Garantir que les icônes restent foncées */
        .theme-light .fas, .theme-light .far, .theme-light .fab {
            color: inherit !important;
        }
        /* Headings in light mode */
        .theme-light h1, .theme-light h2, .theme-light h3 {
            color: #0f172a !important;
        }

    </style>

</html>
